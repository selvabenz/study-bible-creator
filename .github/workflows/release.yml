name: Versioned Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Verify version tag
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "v$VERSION" = "${GITHUB_REF_NAME}"
          grep -q "version = \"$VERSION\"" src-tauri/Cargo.toml
          grep -q "\"version\": \"$VERSION\"" src-tauri/tauri.conf.json

  desktop:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            args: '--bundles nsis'
          - os: macos-14
            args: '--bundles dmg'
          - os: ubuntu-24.04
            args: '--bundles appimage,deb'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci --ignore-scripts
      - run: node scripts/prepare-desktop.mjs
      - run: npx --yes @tauri-apps/cli@2.11.4 build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}
          path: src-tauri/target/release/bundle/**

  publish:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: release-assets }
      - name: Package source
        run: |
          zip -qr "Study-Bible-Creator_${GITHUB_REF_NAME}_source.zip" . -x '.git/*' 'src-tauri/target/*' 'release-assets/*'
          find release-assets -type f -print0 | xargs -0 sha256sum > SHA256SUMS.txt || true
          sha256sum "Study-Bible-Creator_${GITHUB_REF_NAME}_source.zip" >> SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body_path: docs/RELEASE_NOTES_v0.5.0.md
          files: |
            release-assets/**
            Study-Bible-Creator_${{ github.ref_name }}_source.zip
            SHA256SUMS.txt
