name: Versioned Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to rebuild (for example v0.5.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_tag.outputs.tag }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Verify version tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release_tag.outputs.tag }}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' src-tauri/Cargo.toml | head -n 1)

          echo "Release tag:        $TAG"
          echo "package.json:       $PACKAGE_VERSION"
          echo "Cargo.toml:         $CARGO_VERSION"
          echo "tauri.conf.json:    $TAURI_VERSION"

          if [ "$TAG" != "v$PACKAGE_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi
          if [ "$CARGO_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Cargo.toml version $CARGO_VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi
          if [ "$TAURI_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::tauri.conf.json version $TAURI_VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: '--bundles nsis'
            artifact_name: native-Windows
            artifact_path: 'src-tauri/target/release/bundle/nsis/*.exe'
          - os: macos-14
            args: '--bundles dmg'
            artifact_name: native-macOS
            artifact_path: 'src-tauri/target/release/bundle/dmg/*.dmg'
          - os: ubuntu-24.04
            args: '--bundles appimage,deb'
            artifact_name: native-Linux
            artifact_path: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci --ignore-scripts
      - run: node scripts/prepare-desktop.mjs
      - run: npx --yes @tauri-apps/cli@2.11.4 build ${{ matrix.args }}
      - name: Upload final installer artifact only
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [verify, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Download native installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: release-assets
      - name: Stage only distributable installer files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf final-assets
          mkdir -p final-assets
          find release-assets -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -print0 \
            | while IFS= read -r -d '' file; do
                cp "$file" "final-assets/$(basename "$file")"
              done

          echo 'Final release installers:'
          find final-assets -maxdepth 1 -type f -printf '  %f\n' | sort

          test "$(find final-assets -maxdepth 1 -type f -name '*.exe' | wc -l)" -ge 1
          test "$(find final-assets -maxdepth 1 -type f -name '*.dmg' | wc -l)" -ge 1
          test "$(find final-assets -maxdepth 1 -type f -name '*.AppImage' | wc -l)" -ge 1
          test "$(find final-assets -maxdepth 1 -type f -name '*.deb' | wc -l)" -ge 1
      - name: Package source, manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.verify.outputs.tag }}"
          zip -qr "Study-Bible-Creator_${TAG}_source.zip" . \
            -x '.git/*' 'src-tauri/target/*' 'release-assets/*' 'final-assets/*' '*.zip' 'SHA256SUMS.txt' 'release-manifest.json'

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const tag = process.env.RELEASE_TAG;
          const assets = fs.readdirSync('final-assets').sort();
          fs.writeFileSync('release-manifest.json', JSON.stringify({ tag, assets }, null, 2) + '\n');
          NODE

          find final-assets -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum "Study-Bible-Creator_${TAG}_source.zip" release-manifest.json >> SHA256SUMS.txt
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      - name: Remove stale assets from an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/tmp/release.json 2>/dev/null; then
            RELEASE_ID=$(jq -r '.id' /tmp/release.json)
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" --jq '.[].id' \
              | while read -r asset_id; do
                  [ -n "$asset_id" ] && gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
                done
          fi
      - name: Create or update clean GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          prerelease: true
          body_path: docs/RELEASE_NOTES_v0.5.1.md
          files: |
            final-assets/*
            Study-Bible-Creator_${{ needs.verify.outputs.tag }}_source.zip
            SHA256SUMS.txt
            release-manifest.json
