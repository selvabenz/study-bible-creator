name: Desktop Packaging Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Desktop shell status
        shell: bash
        run: |
          if [ -f src-tauri/Cargo.toml ]; then
            echo "Tauri shell is present. Versioned installers are produced by release.yml on v* tags."
          else
            echo "Tauri shell is not present yet. Executable packaging starts at Milestone M2."
          fi
