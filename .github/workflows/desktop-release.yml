name: Desktop Installer Smoke Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['src-tauri/**','src/**','public/**','scripts/prepare-desktop.mjs','package.json']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: '--bundles nsis'
            artifact_name: desktop-Windows
            artifact_path: 'src-tauri/target/release/bundle/nsis/*.exe'
          - os: macos-14
            args: '--bundles dmg'
            artifact_name: desktop-macOS
            artifact_path: 'src-tauri/target/release/bundle/dmg/*.dmg'
          - os: ubuntu-24.04
            args: '--bundles appimage,deb'
            artifact_name: desktop-Linux
            artifact_path: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci --ignore-scripts
      - name: Run unit, sidecar, and performance suites
        run: npm run test:all
      - run: node scripts/prepare-desktop.mjs
      - run: npx --yes @tauri-apps/cli@2.11.4 build ${{ matrix.args }}
      - name: Install and launch the real Windows NSIS build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer not found' }
          ./scripts/windows-installed-smoke.ps1 -InstallerPath $installer.FullName
      - name: Upload final installer artifact only
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          compression-level: 0
