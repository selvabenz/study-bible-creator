name: Package Dev Snapshot

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Create source snapshot
        run: |
          mkdir -p release
          zip -r "release/study-bible-creator-${GITHUB_REF_NAME:-dev}.zip" . \
            -x '.git/*' 'release/*' 'data/*' 'tmp/*' 'node_modules/*'
      - uses: actions/upload-artifact@v4
        with:
          name: study-bible-creator-dev-snapshot
          path: release/*.zip
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
