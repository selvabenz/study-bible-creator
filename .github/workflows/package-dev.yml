name: Package Dev Snapshot

on:
  workflow_dispatch:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Create development source snapshot
        run: |
          mkdir -p release
          zip -r "release/study-bible-creator-dev-${GITHUB_SHA::7}.zip" . \
            -x '.git/*' 'release/*' 'data/*' 'tmp/*' 'node_modules/*'
      - uses: actions/upload-artifact@v4
        with:
          name: study-bible-creator-dev-${{ github.sha }}
          path: release/*.zip
