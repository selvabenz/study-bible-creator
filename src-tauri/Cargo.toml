[package]
name = "study-bible-creator"
version = "0.5.0"
description = "Local-first multilingual Study Bible publishing QA application"
authors = ["Bridgeconn"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "study_bible_creator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
uuid = { version = "1", features = ["v4"] }
url = "2"
